<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Space Defender</title>
    <style>
        body {
            margin: 0;
            background: #050510 url('') center / cover no-repeat fixed;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        #scoreboard {
            font-size: 20px;
            margin-bottom: 10px;
        }
        canvas {
            border: 2px solid #00ffcc;
            background: radial-gradient(circle, #111530 0%, #050510 100%);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        #saucers {
            position: fixed;
            left: 0;
            top: 0;
            width: calc(50vw - 310px);
            min-width: 100px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            pointer-events: none;
        }
        #saucers img {
            width: 120px;
            max-width: 90%;
        }
        @media (max-width: 1000px) {
            body {
                padding-top: 90px;
                box-sizing: border-box;
            }
            #saucers {
                width: 100vw;
                min-width: 0;
                height: 90px;
                flex-direction: row;
            }
            #saucers img {
                width: 80px;
            }
        }
        #playAgain {
            margin-top: 10px;
            padding: 8px 24px;
            font-family: inherit;
            font-size: 18px;
            color: #00ffcc;
            background: #050510;
            border: 2px solid #00ffcc;
            cursor: pointer;
        }
        #playAgain:hover:not(:disabled) {
            background: #00ffcc;
            color: #050510;
        }
        #playAgain:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .instructions {
            margin-top: 10px;
            color: #87ceeb;
            font-size: .75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>


    

    <h1>SPACE DEFENDER</h1>
    <div id="scoreboard">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="540" height="400"></canvas>
        <button id="playAgain" disabled>Play</button>    <div class="instructions">Use [←] [→] Arrow Keys to Move, Press [Spacebar] to Fire Torpedoes</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        // Game State
        let score = 0;
        let lives = 3;
        let gameOver = false;

        // Player Starship Object
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 50,
            width: 40,
            height: 30,
            speed: 6,
            dx: 0
        };

        // Projectiles & Enemies arrays
        const lasers = [];
        const invaders = [];

        // Invader Configuration
        const invaderRows = 3;
        const invaderCols = 7;
        const invaderWidth = 40;
        const invaderHeight = 25;
        let invaderSpeed = 2;
        let invaderDirection = 1; // 1 = Right, -1 = Left

        // Key tracking
        const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

        // Initialize Invaders Wave
        function createInvaders() {
            for (let row = 0; row < invaderRows; row++) {
                for (let col = 0; col < invaderCols; col++) {
                    invaders.push({
                        x: col * (invaderWidth + 20) + 50,
                        y: row * (invaderHeight + 20) + 50,
                        width: invaderWidth,
                        height: invaderHeight,
                        alive: true
                    });
                }
            }
        }

        // Keyboard Handlers
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space' && !keys.Space) {
                keys.Space = true;
                fireLaser();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        function fireLaser() {
            if (gameOver) return;
            lasers.push({
                x: player.x + player.width / 2 - 2,
                y: player.y,
                width: 4,
                height: 15,
                speed: 12
            });
        }

        // Physics & State Updates
        function update() {
            if (gameOver) return;

            // Move Player Ship
            if (keys.ArrowLeft) player.dx = -player.speed;
            else if (keys.ArrowRight) player.dx = player.speed;
            else player.dx = 0;

            player.x += player.dx;

            // Boundary restrictions
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Update Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].y -= lasers[i].speed;
                if (lasers[i].y < 0) {
                    lasers.splice(i, 1);
                }
            }

            // Move Invaders
            let hitWall = false;
            invaders.forEach(invader => {
                if (!invader.alive) return;
                invader.x += invaderSpeed * invaderDirection;

                if (invader.x + invader.width > canvas.width || invader.x < 0) {
                    hitWall = true;
                }
            });

            if (hitWall) {
                invaderDirection *= -1;
                invaders.forEach(invader => {
                    if (invader.alive) invader.y += 15;
                });
            }

            // Collision Detection
            lasers.forEach((laser, lIdx) => {
                invaders.forEach((invader) => {
                    if (invader.alive &&
                        laser.x < invader.x + invader.width &&
                        laser.x + laser.width > invader.x &&
                        laser.y < invader.y + invader.height &&
                        laser.y + laser.height > invader.y) {
                        
                        invader.alive = false;
                        lasers.splice(lIdx, 1);
                        score += 10;
                        scoreEl.innerText = score;
                    }
                });
            });

            // Win condition (All enemies destroyed)
            if (invaders.length > 0 && invaders.every(inv => !inv.alive)) {
                invaderSpeed += 0.5;
                createInvaders();
            }

            // Lose condition (Enemies land)
            invaders.forEach(invader => {
                if (invader.alive && invader.y + invader.height >= player.y) {
                    gameOver = true;
                    playAgainBtn.disabled = false;
                }
            });
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            invaderSpeed = 1;
            invaderDirection = 1;
            player.x = canvas.width / 2 - player.width / 2;
            lasers.length = 0;
            invaders.length = 0;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            createInvaders();
            playAgainBtn.disabled = true;
            playAgainBtn.blur(); // keep Spacebar from re-triggering the button
        }

        const playAgainBtn = document.getElementById('playAgain');
        playAgainBtn.addEventListener('click', () => {
            if (gameOver) resetGame();
        });

        // Canvas Rendering Elements
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = '#ff3333';
                ctx.font = '40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Courier New';
                ctx.fillText("Click Play Again to restart", canvas.width / 2, canvas.height / 2 + 40);
                return;
            }

            // Draw Player Starship (Futuristic Delta Wing style)
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Draw Lasers (Bright Neon Red)
            ctx.fillStyle = '#ff3366';
            lasers.forEach(laser => {
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
            });

            // Draw Invader Alien Starships
            ctx.fillStyle = '#ffcc00';
            invaders.forEach(invader => {
                if (!invader.alive) return;
                // Draw sleek retro block alien shape
                ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(invader.x + 8, invader.y + 6, 6, 6); // Left Eye
                ctx.fillRect(invader.x + invader.width - 14, invader.y + 6, 6, 6); // Right Eye
                ctx.fillStyle = '#ffcc00';
            });
        }

        // Core Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start Game Execution
        createInvaders();
        loop();
    </script>
</body>
</html>
