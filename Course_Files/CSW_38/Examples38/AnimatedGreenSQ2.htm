

<!-- Using Tailwind CSS for modern, responsive page styling -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
    /* Ensuring the canvas scales nicely on smaller screens while maintaining its 700x700 aspect ratio */
    canvas {
        max-width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }
</style>


<h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-green-400 tracking-tight text-center">
    Sample Animated Square
</h1>

<p class="text-slate-400 mb-8 text-center max-w-lg">
    Watch the rounded green square travel across the 700x700 canvas. Upon hitting the right edge, it bounces back and changes to 50% opacity!
</p>

<div class="relative bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-2">
    <canvas id="animCanvas" width="700" height="700" class="bg-slate-950 rounded-xl"></canvas>
    
    <button id="replayBtn" class="absolute top-6 right-6 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-md">
        Replay
    </button>
</div>

<!-- Linking the external JavaScript file -->
<script src="animation2.js"></script>
