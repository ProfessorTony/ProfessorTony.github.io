<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; }
        canvas { background: #334155; border: 4px solid #1e293b; border-radius: 8px; }
    </style>
</head>
<body>

<canvas id="marchCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('marchCanvas');
const ctx = canvas.getContext('2d');

// Load your marching soldier sprite sheet
const soldierSprite = new Image();
soldierSprite.src = 'https://professortony.github.io/images/soldier_t96.png'; // Replace with actual sprite path

const frameWidth = 84;   // Width of one soldier frame
const frameHeight = 96;  // Height of one soldier frame
const totalFrames = 3;   // Total animation frames in the marching cycle
let currentFrame = 0;
let posX = - frameWidth;   // Start just off-screen left
const posY = 180;        // Vertical ground alignment
let gameFrameCount = 0;
const animationSpeed = 6; // Lower numbers make the feet move faster

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw simple background ground line
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, posY + frameHeight); ctx.lineTo(canvas.width, posY + frameHeight); ctx.stroke();

    // Loop through the horizontal sequence of the sprite sheet
    //drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
    ctx.drawImage(
        soldierSprite, 
        currentFrame * frameWidth, 0, frameWidth, frameHeight, 
        posX, posY, frameWidth * 1.5, frameHeight * 1.5 // Scaled slightly larger
    );

    // Advance position across screen
    posX += 1.5;
    if (posX > canvas.width) posX = -frameWidth; // Reset loop back to left side

    // Handle frame timing rhythm 
    gameFrameCount++;
    if (gameFrameCount % animationSpeed === 0) {
        currentFrame = (currentFrame + 1) % totalFrames;
    }

    requestAnimationFrame(animate);
}

// Start once image asset successfully pulls
soldierSprite.onload = () => {
    animate();
};
</script>

</body>
</html>
