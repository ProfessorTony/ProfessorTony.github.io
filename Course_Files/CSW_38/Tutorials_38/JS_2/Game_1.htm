<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Falling Star!</title>
    <link rel="stylesheet" href="Star_style.css">
</head>
<body>

    <div class="game-container">
        <h1>Catch the Falling Star ⭐</h1>
        
        <div class="scoreboard">
            <div>Score: <span id="score">0</span></div>
            <div>Time Left: <span id="timer">30</span>s</div>
        </div>

        <div id="game-board">
            <!-- Stars will be generated here by JavaScript -->
            <div id="start-screen">
                <button id="start-btn">Start Game</button>
            </div>
        </div>
    </div>

    <script src="Star_script.js"></script>
</body>
</html>
